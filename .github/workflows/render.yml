name: Render Short

on:
  # Automatic: add or change manifests/<VIDEO_ID>.json and it renders.
  push:
    branches: [main]
    paths:
      - "manifests/*.json"
  # Manual fallback: paste a manifest by hand.
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video ID, e.g. V001"
        required: true
        type: string
      manifest_json:
        description: "Manifest JSON (clips, audio, text overlays)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, font and captions model runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-montserrat
          pip install --quiet faster-whisper

      - name: Collect manifests to render
        env:
          EVENT: ${{ github.event_name }}
          VIDEO_ID: ${{ inputs.video_id }}
          MANIFEST_JSON: ${{ inputs.manifest_json }}
        run: |
          mkdir -p todo
          if [ "$EVENT" = "workflow_dispatch" ]; then
            printf '%s' "$MANIFEST_JSON" > "todo/${VIDEO_ID}.json"
          else
            for f in $(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'manifests/*.json'); do
              cp "$f" "todo/$(basename "$f")"
            done
          fi
          ls -la todo

      - name: Render and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          shopt -s nullglob
          for m in todo/*.json; do
            id="$(basename "$m" .json)"
            python render.py "$m" --out "${id}.mp4"
            gh release create "${id}-${RUN_ID}" "${id}.mp4" \
              --prerelease --title "${id}" \
              --notes "Rendered by workflow run ${RUN_ID}. Pending approval."
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${id}-${RUN_ID}/${id}.mp4"
            echo "Download: ${url}"
            python email_video.py "${id}" "${id}.mp4" "${url}" || echo "Email step failed (video is still in Releases)"
          done
